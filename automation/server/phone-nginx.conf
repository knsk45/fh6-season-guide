server {
    listen 8443 ssl;
    server_name _;
    ssl_certificate /etc/fh6/phone.crt;
    ssl_certificate_key /etc/fh6/phone.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    auth_basic "FH6 private";
    auth_basic_user_file /etc/fh6/phone.htpasswd;
    access_log off;
    client_max_body_size 20m;
    location = /setup {
        auth_basic off;
        access_log off;
        error_log /dev/null;
        client_max_body_size 4k;
        proxy_pass http://127.0.0.1:8765;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
    }
    location / {
        proxy_pass http://127.0.0.1:8765;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
    }
}
