server {
    listen 8443 ssl;
    server_name _;
    ssl_certificate /etc/fh6/phone.crt;
    ssl_certificate_key /etc/fh6/phone.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    auth_request /_fh6_auth;
    error_page 401 = @fh6_signin;
    access_log off;
    client_max_body_size 20m;
    location @fh6_signin {
        return 303 /signin;
    }
    location = /_fh6_auth {
        internal;
        auth_request off;
        proxy_pass http://127.0.0.1:8766/_auth;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $http_host;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Authorization "";
    }
    location = /signin {
        auth_request off;
        # Do not reinterpret an incorrect password response as a redirect.
        proxy_intercept_errors off;
        client_max_body_size 4k;
        proxy_pass http://127.0.0.1:8766;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Authorization "";
    }
    location = /signout {
        auth_request off;
        proxy_intercept_errors off;
        client_max_body_size 4k;
        proxy_pass http://127.0.0.1:8766;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Authorization "";
    }
    location = /setup {
        auth_request off;
        access_log off;
        error_log /dev/null;
        client_max_body_size 4k;
        proxy_pass http://127.0.0.1:8765;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Authorization "";
    }
    location ^~ /steam-browser/ {
        proxy_pass http://127.0.0.1:6081/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header Authorization "";
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }
    location / {
        proxy_pass http://127.0.0.1:8765;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Authorization "";
    }
}
